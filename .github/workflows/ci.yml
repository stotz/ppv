name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (the comment names the tag); Dependabot
# keeps both in step.

jobs:
  # Formatting and static analysis. clang-format output differs between major
  # versions, so the version is fixed here and in CONTRIBUTING.md.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install clang-format and clang-tidy 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18 clang-tidy-18
      - name: clang-format
        run: |
          clang-format-18 --version
          clang-format-18 --dry-run -Werror src/*.c src/*.h src/platform/*.h \
            src/platform/*/*.c tests/*.c tests/*.h
      - name: clang-tidy
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          clang-tidy-18 --version
          clang-tidy-18 -p build src/*.c src/platform/posix/*.c tests/*.c

  # Native toolchains on all supported platforms: build, unit + end-to-end tests,
  # then a smoke test of the installed binary in a real pipe.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,     os: ubuntu-latest,    cc: gcc,   werror: ON }
          - { name: linux-clang,   os: ubuntu-latest,    cc: clang, werror: ON }
          - { name: linux-arm64,   os: ubuntu-24.04-arm, cc: gcc,   werror: ON }
          - { name: macos,         os: macos-latest,     cc: clang, werror: ON }
          # MSVC /W4 was clean in the first CI run (df26fd6), so warnings are fatal.
          - { name: windows-msvc,  os: windows-latest,   cc: "",    werror: ON }
          - { name: windows-arm64, os: windows-11-arm,   cc: "",    werror: ON }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPPV_WARNINGS_AS_ERRORS=${{ matrix.werror }}
          ${{ matrix.cc && format('-DCMAKE_C_COMPILER={0}', matrix.cc) || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release --prefix stage

      - name: Smoke test
        run: |
          stage/bin/ppv --version
          test -f stage/share/man/man1/ppv.1
          head -c 200000000 /dev/zero | stage/bin/ppv -q -s | cat > /dev/null

  # MinGW-w64 / UCRT64 as used locally (MSYS2), with the debug preset (-Werror).
  windows-mingw:
    name: windows-mingw
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - run: ctest --preset debug

  # The POSIX layer on a BSD (clang, no splice, no --pid).
  freebsd:
    name: freebsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          usesh: true
          prepare: pkg install -y cmake ninja
          run: |
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPPV_WARNINGS_AS_ERRORS=ON
            cmake --build build
            ctest --test-dir build --output-on-failure

  # Memory errors, undefined behaviour and data races between the threads.
  sanitizers:
    name: sanitizer-${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: address-undefined, flags: "-fsanitize=address,undefined -fno-sanitize-recover=all" }
          - { name: thread,            flags: "-fsanitize=thread" }
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Allow TSan with high-entropy ASLR
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          "-DCMAKE_C_FLAGS=${{ matrix.flags }} -fno-omit-frame-pointer"
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  # Line coverage of src/ from the whole test suite (gcc/gcov, gcovr), for
  # the POSIX layer on Linux and the Win32 layer on MinGW. What is left
  # uncovered is error paths that need fault injection (ENOMEM,
  # pthread_create failing). PPV_COVERAGE makes ppv flush the gcov data
  # before it dies by signal, so the Ctrl-C paths count too.
  coverage:
    name: coverage-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx install gcovr # pip refuses --user on the externally managed runner Python
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc
          -DPPV_COVERAGE=ON
          "-DCMAKE_C_FLAGS=--coverage -O0"
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: Report
        run: |
          mkdir -p coverage
          gcovr --root . --filter src/ --exclude-unreachable-branches \
            --print-summary --fail-under-line 85 \
            --html-details coverage/index.html --txt coverage/summary.txt build
          cat coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux
          path: coverage/
          if-no-files-found: error

  coverage-windows:
    name: coverage-windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python-gcovr
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DPPV_COVERAGE=ON
          "-DCMAKE_C_FLAGS=--coverage -O0"
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: Report
        # Same threshold as Linux: the first run (e348ad8) measured 89.4 %.
        run: |
          mkdir -p coverage
          gcovr --root . --filter src/ --exclude-unreachable-branches \
            --print-summary --fail-under-line 85 \
            --html-details coverage/index.html --txt coverage/summary.txt build
          cat coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-windows
          path: coverage/
          if-no-files-found: error
