name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 4 * * 1" # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Both, because each compiles a different platform layer.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPPV_BUILD_TESTS=OFF
          cmake --build build --config Release --parallel
      - uses: github/codeql-action/analyze@v3
        with:
          category: /os:${{ matrix.os }}
