name: Release

# Push a tag that matches the project version in CMakeLists.txt and has an
# entry in CHANGELOG.md, e.g.:
#   git tag -s v0.1.0 -m "ppv 0.1.0" && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write     # Sigstore certificate for the attestation
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          # Oldest supported Ubuntu = widest glibc compatibility.
          - { target: linux-x64,     os: ubuntu-22.04 }
          - { target: linux-arm64,   os: ubuntu-22.04-arm }
          - { target: macos-universal, os: macos-latest, osx_arch: "arm64;x86_64" }
          # MSVC with static runtime: depends on kernel32 only.
          - { target: windows-x64,   os: windows-latest }
          - { target: windows-arm64, os: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test
        env:
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.osx_arch }} # read by CMake; empty elsewhere
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
          cmake --install build --config Release --prefix stage

      - name: Check that the tag matches the project version and the changelog
        run: |
          version="$(stage/bin/ppv --version | cut -d' ' -f2)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project version $version (CMakeLists.txt)"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Package
        run: |
          name="ppv-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp stage/bin/ppv* README.md CHANGELOG.md LICENSE docs/ppv.1 "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -E tar cf "$name.zip" --format=zip "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"

      # Signed build provenance: proves the archive was built by this workflow
      # from this commit. Verify with: gh attestation verify FILE -R stotz/ppv
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { on = ($0 ~ "^## \\[" v "\\]") ; next }
            on { print }
          ' src/CHANGELOG.md > notes.md
          test -s notes.md
          cat notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "ppv $GITHUB_REF_NAME"
          --notes-file notes.md
          --verify-tag
